<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dsaGrad1" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="dsaGrad2" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="dsaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Connecting graph/tree branches -->
  <path d="M32 18 L16 36 M32 18 L48 36 M16 42 L10 52 M16 42 L24 52 M48 42 L40 52 M48 42 L54 52" 
        stroke="url(#dsaGrad1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Cross-graph algorithmic edge -->
  <path d="M24 52 Q32 44 40 52" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.7"/>

  <!-- Root Node -->
  <g filter="url(#dsaGlow)">
    <circle cx="32" cy="16" r="8" fill="#18122B" stroke="url(#dsaGrad1)" stroke-width="2.5"/>
    <circle cx="32" cy="16" r="3.5" fill="#c084fc"/>
  </g>

  <!-- Level 1 Nodes -->
  <g filter="url(#dsaGlow)">
    <circle cx="16" cy="38" r="6.5" fill="#18122B" stroke="url(#dsaGrad2)" stroke-width="2.2"/>
    <circle cx="16" cy="38" r="2.8" fill="#38bdf8"/>

    <circle cx="48" cy="38" r="6.5" fill="#18122B" stroke="url(#dsaGrad2)" stroke-width="2.2"/>
    <circle cx="48" cy="38" r="2.8" fill="#818cf8"/>
  </g>

  <!-- Leaf Nodes -->
  <circle cx="10" cy="53" r="4" fill="url(#dsaGrad1)"/>
  <circle cx="24" cy="53" r="4" fill="url(#dsaGrad2)"/>
  <circle cx="40" cy="53" r="4" fill="url(#dsaGrad2)"/>
  <circle cx="54" cy="53" r="4" fill="url(#dsaGrad1)"/>
</svg>