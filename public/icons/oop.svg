<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="oopGrad1" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="oopGrad2" x1="0" y1="30" x2="64" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="oopGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ec4899" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 3D Class / Object Blueprint Cube -->
  <g filter="url(#oopGlow)">
    <!-- Top Face -->
    <polygon points="32,8 52,19 32,30 12,19" fill="#24143a" stroke="url(#oopGrad1)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Left Face -->
    <polygon points="12,19 32,30 32,54 12,43" fill="#180e28" stroke="url(#oopGrad1)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Right Face -->
    <polygon points="32,30 52,19 52,43 32,54" fill="#1d1130" stroke="url(#oopGrad1)" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <!-- Encapsulation / Interface Inner Nodes -->
  <circle cx="32" cy="19" r="3" fill="#f472b6"/>
  <circle cx="22" cy="37" r="2.5" fill="#c084fc"/>
  <circle cx="42" cy="37" r="2.5" fill="#818cf8"/>

  <!-- Inheritance Link Vector -->
  <path d="M32 40 L32 50" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 37 L32 42 L42 37" stroke="url(#oopGrad2)" stroke-width="1.8" stroke-dasharray="2 2"/>

  <!-- Method & Property Micro Markers -->
  <line x1="16" y1="28" x2="26" y2="33" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="38" y1="33" x2="48" y2="28" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
</svg>